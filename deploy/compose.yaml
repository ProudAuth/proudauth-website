name: proudauth-website-preview
services:
  website:
    image: ${WEBSITE_IMAGE:-proudauth-website:0.2.0-snapshot}
    pull_policy: never
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    ports: ["127.0.0.1:${WEBSITE_PORT:-8096}:8080"]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8080/docs/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
