worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  client_max_body_size 16k;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
  add_header Cache-Control "no-cache" always;
  server {
    listen 8080 default_server;
    root /site;
    index index.html;
    error_page 404 /docs/404.html;
    location = /docs { return 308 /docs/$is_args$args; }
    location ~ (^|/)\. { return 404; }
    location / { limit_except GET { deny all; } try_files $uri $uri/ =404; }
  }
  server {
    listen 8080;
    server_name www.proudauth.com;
    return 308 https://proudauth.com$request_uri;
  }
  server {
    listen 8080;
    server_name docs.proudauth.com;
    return 308 https://proudauth.com/docs$request_uri;
  }
}
