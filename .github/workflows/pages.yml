name: Deploy GitHub Pages

# The published documentation always follows the latest ProudAuth release:
# every run syncs the docs from that release tag, so the version and the
# install instructions come from proudbase/proudauth, never from hand edits.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Sent by the ProudAuth release workflow when a dispatch token is configured.
  repository_dispatch:
    types: [proudauth-release]
  # Picks up a new release within the hour without any token.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - name: Find the latest ProudAuth release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag=$(gh api 'repos/proudbase/proudauth/releases?per_page=30' --jq '[.[] | select(.draft | not)] | first | .tag_name')
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo "Unexpected release tag: $tag"; exit 1; }
          live=$(curl -fsS --max-time 20 https://proudauth.com/docs/build-info.json | jq -r '.release // empty' || true)
          deploy=true
          if [ "$EVENT" = schedule ] && [ "$live" = "$tag" ]; then deploy=false; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Latest release $tag; published site ${live:-unknown}; deploy=$deploy"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.release.outputs.deploy == 'true'
        with:
          path: site
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.release.outputs.deploy == 'true'
        with:
          repository: proudbase/proudauth
          ref: ${{ steps.release.outputs.tag }}
          path: proudauth
      - name: Check out the five SDK repositories
        if: steps.release.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          for language in go node dart php dotnet; do
            git clone --quiet --depth 1 --branch main "https://github.com/proudbase/proudauth-sdk-$language" "proudauth-sdk-$language"
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.release.outputs.deploy == 'true'
        with:
          node-version: '24'
      - name: Sync the documentation from the release
        if: steps.release.outputs.deploy == 'true'
        working-directory: site
        run: node scripts/sync-content.mjs --service=../proudauth --sdk-root=.. --release=${{ steps.release.outputs.tag }}
      - name: Configure GitHub Pages
        if: steps.release.outputs.deploy == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build and verify the static publication
        if: steps.release.outputs.deploy == 'true'
        working-directory: site
        run: npm run check
      - name: Upload verified website
        if: steps.release.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v4
        with:
          path: site/dist
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
